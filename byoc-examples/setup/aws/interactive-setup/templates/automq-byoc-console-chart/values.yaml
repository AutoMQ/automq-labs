automqByocConsole:
  config:
    existingSecret: ""

cloudProvider: aws

aws:
  account: ""
  network:
    vpcId: ""
    subnetIds: []

image:
  repository: automq.azurecr.io/automq/automq-byoc-console
  tag: ""
  pullPolicy: Always

nodeAffinities: []
resources:
  requests:
    cpu: 1000m
    memory: 4Gi
  limits:
    cpu: 2000m
    memory: 8Gi

persistence:
  storageClass: "standard"
  accessModes:
    - ReadWriteOnce
  size: 20Gi

serviceAccount:
  name: ""

service:
  type: ClusterIP
  annotations: {}
  labels: {}
  ports:
    web: 80

ingress:
  enabled: false
  className: alb
  host: ""
  path: /
  pathType: Prefix
  alb:
    scheme: internet-facing
    protocol: HTTPS
    certificateArn: ""
    healthCheckPath: /health
    idleTimeoutSeconds: 1800
