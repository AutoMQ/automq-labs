apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-web-loadbalancer" (include "automq-byoc-console.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "automq-byoc-console.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  type: {{ .Values.service.type }}
  ports:
    - name: web
      port: {{ .Values.service.ports.web }}
      protocol: TCP
      targetPort: web
  selector:
    {{- include "automq-byoc-console.selectorLabels" . | nindent 4 }}
