name: Terraform Validate

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.tftest.hcl'
      - 'byoc-examples/setup/aws/ec2/automq-cluster/configure-from-console.sh'
      - '.github/workflows/terraform-validate.yml'
  pull_request:
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.tftest.hcl'
      - 'byoc-examples/setup/aws/ec2/automq-cluster/configure-from-console.sh'
      - '.github/workflows/terraform-validate.yml'

jobs:
  terraform-validate:
    name: 'Terraform Validate'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Validate Terraform modules
      run: |
        set +e  # Continue on error to validate all modules
        failed=0
        
        # Find all Terraform module directories (exclude .terraform and .git)
        echo "📋 Finding Terraform modules to validate..."
        modules=$(find . -type d \( -name ".terraform" -o -name ".git" \) -prune -o \
          -name "*.tf" -type f -print | xargs dirname | sort -u | grep -v "/\.terraform")
        
        # List all modules
        counter=1
        for dir in $modules; do
          echo "  $counter. $dir"
          counter=$((counter + 1))
        done

        # Validate each module
        counter=1
        for dir in $modules; do
          echo "::group::[$counter/$module_count] Validating $dir"
          cd "$dir"
          terraform init -backend=false > /dev/null 2>&1
          if ! terraform validate; then
            failed=1
          fi
          cd "${{ github.workspace }}"
          echo "::endgroup::"
          counter=$((counter + 1))
        done

  ec2-terraform-contract:
    name: 'EC2 Terraform Contract (${{ matrix.name }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Console
            directory: byoc-examples/setup/aws/ec2/automq-console
          - name: Cluster
            directory: byoc-examples/setup/aws/ec2/automq-cluster
          - name: Data Plane Role
            directory: byoc-examples/setup/aws/ec2/modules/automq-role

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.11.4

    - name: Initialize
      working-directory: ${{ matrix.directory }}
      run: terraform init -backend=false -input=false

    - name: Validate
      working-directory: ${{ matrix.directory }}
      run: terraform validate

    - name: Run contract tests
      working-directory: ${{ matrix.directory }}
      run: terraform test

  ec2-helper-script:
    name: 'EC2 Helper Script'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install ShellCheck
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --yes shellcheck

    - name: Validate script
      run: |
        bash -n byoc-examples/setup/aws/ec2/automq-cluster/configure-from-console.sh
        shellcheck byoc-examples/setup/aws/ec2/automq-cluster/configure-from-console.sh
