name: Terraform Validate

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.tftest.hcl'
      - 'byoc-examples/setup/aws/aws-automq-env/**'
      - '.github/workflows/terraform-validate.yml'
  pull_request:
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.tftest.hcl'
      - 'byoc-examples/setup/aws/aws-automq-env/**'
      - '.github/workflows/terraform-validate.yml'

jobs:
  terraform-validate:
    name: 'Terraform Validate'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Validate and test Terraform modules
      run: |
        set +e  # Continue on error to validate all modules
        failed=0
        test_failed=0
        
        # Find all Terraform module directories (exclude .terraform and .git)
        echo "📋 Finding Terraform modules to validate..."
        modules=$(find . -type d \( -name ".terraform" -o -name ".git" \) -prune -o \
          -name "*.tf" -type f -print | xargs dirname | sort -u | grep -v "/\.terraform")
        module_count=$(printf '%s\n' "$modules" | wc -l | tr -d ' ')
        
        # List all modules
        counter=1
        for dir in $modules; do
          echo "  $counter. $dir"
          counter=$((counter + 1))
        done

        # Validate each module
        counter=1
        for dir in $modules; do
          echo "::group::[$counter/$module_count] Validating $dir"
          cd "$dir"
          terraform init -backend=false > /dev/null 2>&1
          if ! terraform validate; then
            failed=1
          fi
          if [ -n "$(find tests -maxdepth 1 -type f -name '*.tftest.hcl' -print -quit 2>/dev/null)" ]; then
            if ! terraform test; then
              test_failed=1
            fi
          fi
          cd "${{ github.workspace }}"
          echo "::endgroup::"
          counter=$((counter + 1))
        done

        exit "$test_failed"

  eks-8x-contract:
    name: 'New EKS: ${{ matrix.root }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [network-example, infrastructure, console, automq-example/instance, automq-example/smoke]
    defaults:
      run:
        working-directory: byoc-examples/setup/aws/aws-automq-env/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - name: Initialize
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate -no-color
      - name: Mock and negative contract tests
        run: terraform test -no-color

  eks-8x-chart-scripts:
    name: 'New EKS: Chart, scripts and docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.1
        with:
          version: 'v3.19.0'
      - name: Install parser
        run: python -m pip install PyYAML==6.0.3
      - name: Render official pinned OCI Chart
        run: python byoc-examples/setup/aws/aws-automq-env/scripts/check-chart.py
      - name: Check script syntax and documentation
        run: python byoc-examples/setup/aws/aws-automq-env/scripts/check-static.py
