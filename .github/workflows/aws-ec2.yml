name: AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'byoc-examples/setup/aws/ec2/**'
      - '.github/workflows/aws-ec2.yml'
  pull_request:
    paths:
      - 'byoc-examples/setup/aws/ec2/**'
      - '.github/workflows/aws-ec2.yml'

jobs:
  terraform-contract:
    name: Terraform Contract (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Console
            directory: byoc-examples/setup/aws/ec2/automq-console
          - name: Cluster
            directory: byoc-examples/setup/aws/ec2/automq-cluster
          - name: Data Plane Role
            directory: byoc-examples/setup/aws/ec2/modules/automq-role

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.11.4

    - name: Initialize
      working-directory: ${{ matrix.directory }}
      run: terraform init -backend=false -input=false

    - name: Validate
      working-directory: ${{ matrix.directory }}
      run: terraform validate

    - name: Run contract tests
      working-directory: ${{ matrix.directory }}
      run: terraform test

  helper-script:
    name: Helper Script
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install ShellCheck
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --yes shellcheck

    - name: Validate script
      run: |
        bash -n byoc-examples/setup/aws/ec2/automq-cluster/configure-from-console.sh
        shellcheck byoc-examples/setup/aws/ec2/automq-cluster/configure-from-console.sh
